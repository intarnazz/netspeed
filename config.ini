# Настройки netspeed.py
# Неверные значения игнорируются: вместо них используется значение по умолчанию.
# Логические значения: true / false (также yes / no, on / off, 1 / 0).

[settings]
# Сохранять ли логи запусков в папку logs/
logging_enabled = false

# Сколько последних логов хранить (нужно logging_enabled = true).
# 0 = ничего не хранить, то есть логи фактически выключены.
max_logs = 0

# Сохранять ли скачанные файлы в папку downloads/
download_files = false

# Сохранять только первый успешно скачанный файл каждого адреса,
# остальные запросы читаются и отбрасываются (нужно download_files = true).
download_first_only = false

# Таймаут на соединение и на ожидание очередной порции данных, секунды.
timeout = 30
